[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'cytose-flow'
version = '0.1.0'
description = 'Cross-platform flow cytometry analysis'
license = {file = 'LICENSE'}
requires-python = '>=3.10'
dependencies = ['numpy>=1.24', 'PySide6-Essentials==6.12.0']

[project.scripts]
cytose = 'cytose.app:main'

[tool.setuptools.packages.find]
where = ['.']
include = ['cytose*']

[tool.setuptools.package-data]
cytose = ['fonts/*.ttf', 'fonts/OFL.txt']
