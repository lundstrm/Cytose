name: Python desktop
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./python pyinstaller
      - run: python -m unittest discover -s python/tests -v
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen

  windows-app:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install ./python pyinstaller
      - run: python python/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Cytose-Windows-x64
          path: dist/windows/Cytose-Windows-x64.zip
          if-no-files-found: error

  macos-app:
    needs: test
    # GitHub's macOS runners are Apple Silicon, so this builds the arm64 app.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./python pyinstaller
      - run: sh python/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Cytose-macOS-AppleSilicon
          path: dist/macos/Cytose-macOS-AppleSilicon.zip
          if-no-files-found: error

  release:
    # Pushing a tag such as v0.1.0 publishes both apps as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-app, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/Cytose-Windows-x64.zip
            apps/Cytose-macOS-AppleSilicon.zip
          generate_release_notes: true
